<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Connections to API + image host, started early -->
    <link rel="preconnect" href="https://manyara-travel-backend-2yco.onrender.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Fonts: one combined request, non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <title>Manyara Privé Vacations — Travel Packages, Planned Simply</title>


    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Match your top bar / page background (rose-ivory theme) -->
    <meta name="theme-color" content="#FFF8F5" />

    <!-- SEO fallbacks (react-helmet-async overrides per route) -->
    <meta
      name="description"
      content="Honest, curated travel packages to India's most-visited destinations, planned by people who've actually been there."
    />

    <!-- Enable once the custom domain is live on Vercel:
    <link rel="canonical" href="https://manyaraprive.com/" />
    -->

    <!-- Open Graph -->
    <meta property="og:site_name" content="Manyara Privé Vacations" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Manyara Privé Vacations — Travel Packages, Planned Simply" />
    <meta
      property="og:description"
      content="Honest, curated travel packages to India's most-visited destinations, planned by people who've actually been there."
    />
    <meta property="og:url" content="https://manyara-travel-frontend-nine.vercel.app/" />
    <meta property="og:image" content="https://manyara-travel-frontend-nine.vercel.app/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://manyara-travel-frontend-nine.vercel.app/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
