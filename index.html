
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <title>Manyara Prive Vacations— Travel Packages, Planned Simply</title>

    <!-- =========================================================
         FAVICON
         ========================================================= -->

          <link
        rel="preload"
        as="image"
        href="/images/Manyara_2.webp"
        fetchpriority="high"
      />

    <link
      rel="icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <meta name="theme-color" content="#03112D" />

    <!-- =========================================================
         SEO
         react-helmet-async overwrites these per-route once
         the app mounts.

         They stay here as fallbacks for the brief moment before
         hydration and for crawlers that don't execute JS.
         ========================================================= -->

    <meta
      name="description"
      content="Honest, curated travel packages to India's most-visited destinations, planned by people who've actually been there."
    />

    <link
      rel="canonical"
      href="https://manyaraprive.com/"
    />

    <!-- =========================================================
         OPEN GRAPH
         ========================================================= -->

    <meta
      property="og:site_name"
      content="Manyara Prive Vacations Holiday"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Manyara Prive Vacations Holiday — Travel Packages, Planned Simply"
    />

    <meta
      property="og:description"
      content="Honest, curated travel packages to India's most-visited destinations, planned by people who've actually been there."
    />

    <meta
      property="og:url"
      content="https://manyaraprive.com/"
    />

    <!-- =========================================================
         TWITTER / X
         ========================================================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
